<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vanhGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6AD2" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="64" height="64" rx="18" fill="#07070A" />
  <rect width="60" height="60" x="2" y="2" rx="16" stroke="url(#vanhGradient)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Monogram V & Soundwave Bars with Glow -->
  <g filter="url(#glow)">
    <!-- Left Diagonal of V -->
    <path d="M 12 14 L 30 52 C 31 54 34 54 35 52" stroke="url(#vanhGradient)" stroke-width="6" stroke-linecap="round" />

    <!-- 4 Soundwave Bars forming the right side of V -->
    <line x1="36" y1="32" x2="36" y2="52" stroke="url(#vanhGradient)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="44" y1="20" x2="44" y2="52" stroke="url(#vanhGradient)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="52" y1="12" x2="52" y2="52" stroke="url(#vanhGradient)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
